<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学習ナビ Pro - 超・快適テスト対策</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap');
    body { font-family: 'Noto Sans JP', sans-serif; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 10px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50 shadow-lg">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="showScreen('home')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-rocket text-white"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg leading-none bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 to-purple-300">学習ナビ Pro</h1>
          <span class="text-[10px] text-slate-400 font-medium tracking-widest uppercase">Self Study Engine</span>
        </div>
      </div>
      <div class="flex gap-4">
        <div class="text-right hidden sm:block">
          <div class="text-[10px] text-slate-400 uppercase tracking-wider">Today's Study</div>
          <div class="text-sm font-bold text-emerald-400" id="header-today-time">0分</div>
        </div>
        <button onclick="resetStats()" class="text-xs text-slate-500 hover:text-rose-400 transition flex items-center gap-1 bg-slate-800/50 px-3 py-1.5 rounded-lg border border-slate-700/50 hover:border-rose-500/30">
          <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">学習データ初期化</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full relative">

    <!-- 1. HOME SCREEN -->
    <div id="screen-home" class="fade-in space-y-8">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <section class="lg:col-span-1 space-y-4">
          <div class="bg-gradient-to-br from-slate-800 to-slate-800/60 border border-slate-700/60 rounded-3xl p-6 shadow-xl relative overflow-hidden">
            <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-6 flex items-center gap-2">
              <i class="fa-solid fa-fire text-orange-400"></i> 学習モチベーション
            </h2>
            <div class="space-y-6 relative z-10">
              <div>
                <div class="text-xs text-slate-400 mb-1">今日の勉強時間</div>
                <div class="flex items-baseline gap-1">
                  <span id="stat-today-time" class="text-4xl font-extrabold text-white">0</span>
                  <span class="text-sm text-slate-400 font-bold">分</span>
                </div>
              </div>
              <div>
                <div class="text-xs text-slate-400 mb-1">総勉強時間</div>
                <div class="flex items-baseline gap-1">
                  <span id="stat-total-time-h" class="text-2xl font-bold text-indigo-300">0</span><span class="text-xs text-indigo-400/70 mr-1">時間</span>
                  <span id="stat-total-time-m" class="text-2xl font-bold text-indigo-300">0</span><span class="text-xs text-indigo-400/70">分</span>
                </div>
              </div>
              <div class="pt-4 border-t border-slate-700/50 flex justify-between items-center">
                <div>
                  <div class="text-[10px] text-slate-400 uppercase">解いた問題数</div>
                  <div id="stat-total-q" class="text-lg font-bold text-slate-200">0問</div>
                </div>
                <div class="text-right">
                  <div class="text-[10px] text-slate-400 uppercase">平均正答率</div>
                  <div id="stat-avg-acc" class="text-lg font-bold text-emerald-400">0%</div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="lg:col-span-2 bg-slate-800/40 border border-slate-700/50 rounded-3xl p-6 shadow-lg">
          <div class="flex justify-between items-end mb-4">
            <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
              <i class="fa-solid fa-chart-column text-purple-400"></i> 直近7日間の学習時間
            </h2>
          </div>
          <div class="h-48 w-full"><canvas id="studyChart"></canvas></div>
        </section>
      </div>

      <section class="space-y-4 pt-4">
        <h2 class="text-xl font-bold flex items-center gap-2 mb-4">
          <i class="fa-solid fa-book-open-reader text-indigo-400"></i> 学習する教科を選択
        </h2>
        <!-- 教科リストがここにJSで自動生成されます -->
        <div id="subject-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </section>
    </div>

    <!-- 2. QUIZ SETUP SCREEN -->
    <div id="screen-quiz" class="hidden fade-in space-y-6 max-w-2xl mx-auto mt-10">
      <button onclick="showScreen('home')" class="text-sm text-slate-400 hover:text-slate-200 transition flex items-center gap-2 mb-4">
        <i class="fa-solid fa-arrow-left"></i> ホームに戻る
      </button>
      <div class="bg-gradient-to-b from-slate-800 to-slate-900 border border-slate-700/60 rounded-3xl p-8 shadow-2xl relative overflow-hidden text-center">
        <div id="setup-icon" class="w-20 h-20 mx-auto rounded-2xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-4xl mb-4 relative z-10"></div>
        <h2 id="setup-title" class="text-3xl font-extrabold text-white relative z-10 mb-2"></h2>
        <p class="text-sm text-slate-400 relative z-10 mb-8"><span id="setup-count" class="font-bold text-slate-200"></span>問のデータがロードされました。</p>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 relative z-10">
          <button onclick="startQuizEngine(10)" class="p-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-600 hover:border-indigo-500 transition-all group shadow-lg">
            <div class="text-xl font-bold text-white group-hover:text-indigo-300">10問テスト</div>
            <div class="text-xs text-slate-400 mt-1">ランダムにサクッと復習</div>
          </button>
          <button onclick="startQuizEngine(30)" class="p-4 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-600 hover:border-purple-500 transition-all group shadow-lg">
            <div class="text-xl font-bold text-white group-hover:text-purple-300">30問テスト</div>
            <div class="text-xs text-slate-400 mt-1">定期テスト前の腕試し</div>
          </button>
          <button onclick="startQuizEngine(0)" class="p-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 border border-indigo-400/50 transition-all group shadow-lg sm:col-span-2">
            <div class="text-xl font-bold text-white">全問ぶっ通しチャレンジ</div>
            <div class="text-xs text-indigo-200 mt-1">収録されている全ての問題に挑戦</div>
          </button>
        </div>
      </div>
    </div>

    <!-- 3. ACTIVE QUIZ ENGINE -->
    <div id="screen-engine" class="hidden fade-in max-w-2xl mx-auto flex flex-col min-h-[70vh]">
      <div class="flex items-center justify-between mb-6 pt-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-bold text-slate-300">
            Q<span id="engine-q-num">1</span>
          </div>
          <div class="text-xs font-bold text-indigo-400 tracking-wider bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20" id="q-category">カテゴリー</div>
        </div>
        <div class="text-right">
          <div class="text-sm font-bold text-slate-200"><span id="engine-progress-text">1 / 10</span></div>
        </div>
      </div>
      <div class="w-full bg-slate-800/80 h-1.5 rounded-full overflow-hidden mb-8">
        <div id="engine-progress-bar" class="bg-gradient-to-r from-indigo-500 to-purple-500 h-full transition-all duration-300 ease-out" style="width: 10%"></div>
      </div>
      <div class="flex-1 flex flex-col">
        <h3 id="q-text" class="text-xl sm:text-2xl font-bold leading-relaxed mb-8 text-white">問題文</h3>
        <div id="q-options" class="space-y-3 mt-auto"></div>
        <div id="feedback-box" class="hidden mt-6 p-5 rounded-2xl border space-y-3 fade-in shadow-lg">
          <div class="flex items-center gap-2 font-bold text-lg" id="feedback-title"></div>
          <p id="feedback-desc" class="text-sm text-slate-300 leading-relaxed font-medium"></p>
          <button onclick="nextQuestion()" class="mt-4 w-full py-4 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl transition flex justify-center items-center gap-2">
            次の問題へ <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 4. RESULT SCREEN -->
    <div id="screen-result" class="hidden fade-in max-w-2xl mx-auto mt-6">
      <div class="bg-slate-800/80 border border-slate-700 rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden backdrop-blur">
        <div class="inline-flex items-center justify-center w-24 h-24 rounded-full bg-gradient-to-tr from-emerald-400 to-teal-500 text-white text-4xl mb-6">
          <i id="result-icon" class="fa-solid fa-crown"></i>
        </div>
        <h2 class="text-3xl font-extrabold text-white mb-2">テスト完了！</h2>
        <div class="grid grid-cols-2 gap-4 mb-8">
          <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-700/50">
            <div class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">正答率</div>
            <div id="result-acc" class="text-4xl font-extrabold text-white">0%</div>
            <div id="result-score-detail" class="text-xs text-slate-400 mt-1">0 / 0 問正解</div>
          </div>
          <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-700/50">
            <div class="text-[10px] text-slate-400 uppercase tracking-wider mb-1">かかった時間</div>
            <div id="result-time" class="text-4xl font-extrabold text-indigo-300">0:00</div>
          </div>
        </div>
        <div class="flex flex-col sm:flex-row gap-3">
          <button onclick="showScreen('home')" class="flex-1 py-4 bg-slate-700 hover:bg-slate-600 font-bold rounded-xl transition">ホームへ戻る</button>
          <button onclick="retrySubject()" class="flex-1 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition">もう一度挑戦</button>
        </div>
      </div>
      <div id="review-section" class="mt-8 space-y-4 hidden">
        <h3 class="text-lg font-bold flex items-center gap-2 text-rose-300 mb-6"><i class="fa-solid fa-notes-medical"></i> 復習レポート</h3>
        <div id="review-list" class="space-y-4"></div>
      </div>
    </div>
  </main>

  <script>
    // ==========================================
    // 教科データの設定（ここでファイルを追加・管理します）
    // ==========================================
    const APP_SUBJECTS = [
      {
        id: "geology",
        name: "地学（中間テスト対策）",
        desc: "雲、大気循環、偏西風、カルマン渦など",
        icon: "fa-earth-asia",
        color: "indigo",
        // リポジトリ内の相対パスを指定
        dataFile: "data/geology.json"
      }
      /* 新しい教科を追加する場合は、以下のようにコピーして書き足すだけ！
      ,{
        id: "physics",
        name: "物理",
        desc: "力学・波動の小テスト",
        icon: "fa-atom",
        color: "emerald",
        dataFile: "data/physics.json"
      }
      */
    ];

    // ==========================================
    // アプリの状態管理・初期化
    // ==========================================
    let userStats = JSON.parse(localStorage.getItem('studyNav_stats')) || {
      totalTimeSec: 0, todayTimeSec: 0, lastDate: new Date().toDateString(),
      totalQuestions: 0, totalCorrect: 0, dailyLog: {}
    };

    const todayStr = new Date().toDateString();
    if (userStats.lastDate !== todayStr) {
      userStats.todayTimeSec = 0; userStats.lastDate = todayStr; saveStats();
    }
    if (!userStats.dailyLog[todayStr]) userStats.dailyLog[todayStr] = { timeSec: 0, qCount: 0 };

    let currentSubject = null, currentQuizSet = [], activeQuestions = [], currentQuestionIndex = 0, score = 0, wrongAnswersLog = [], sessionStartTime = 0, chartInstance = null;

    window.onload = initApp;

    function initApp() {
      renderSubjects(); 
      updateDashboardUI(); 
      renderChart();
    }

    function saveStats() { localStorage.setItem('studyNav_stats', JSON.stringify(userStats)); }

    function showScreen(screenName) {
      ['home', 'quiz', 'engine', 'result'].forEach(s => document.getElementById(`screen-${s}`).classList.add('hidden'));
      document.getElementById(`screen-${screenName}`).classList.remove('hidden');
      window.scrollTo(0, 0);
      if (screenName === 'home') { updateDashboardUI(); if(chartInstance) chartInstance.destroy(); renderChart(); }
    }

    function updateDashboardUI() {
      const todayMin = Math.floor(userStats.todayTimeSec / 60);
      document.getElementById('stat-today-time').innerText = todayMin;
      document.getElementById('header-today-time').innerText = `${todayMin}分`;
      document.getElementById('stat-total-time-h').innerText = Math.floor(userStats.totalTimeSec / 3600);
      document.getElementById('stat-total-time-m').innerText = Math.floor((userStats.totalTimeSec % 3600) / 60);
      document.getElementById('stat-total-q').innerText = `${userStats.totalQuestions}問`;
      document.getElementById('stat-avg-acc').innerText = `${userStats.totalQuestions > 0 ? Math.round((userStats.totalCorrect / userStats.totalQuestions) * 100) : 0}%`;
    }

    function renderSubjects() {
      const container = document.getElementById('subject-list');
      container.innerHTML = '';
      
      APP_SUBJECTS.forEach(sub => {
        const color = sub.color || 'indigo';
        const card = document.createElement('div');
        card.className = `group bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 hover:border-${color}-500/50 rounded-3xl p-6 cursor-pointer transition shadow-lg relative overflow-hidden`;
        card.onclick = () => selectSubject(sub);
        card.innerHTML = `
          <div class="w-14 h-14 rounded-2xl bg-${color}-500/10 text-${color}-400 flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition-transform">
            <i class="fa-solid ${sub.icon || 'fa-book'}"></i>
          </div>
          <h3 class="text-lg font-bold text-white group-hover:text-${color}-300">${sub.name}</h3>
          <p class="text-xs text-slate-400 mt-2">${sub.desc}</p>
        `;
        container.appendChild(card);
      });
    }

    function renderChart() {
      const ctx = document.getElementById('studyChart').getContext('2d'), labels = [], dataPoints = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date(); d.setDate(d.getDate() - i);
        labels.push(`${d.getMonth()+1}/${d.getDate()}`);
        dataPoints.push(userStats.dailyLog[d.toDateString()] ? Math.round(userStats.dailyLog[d.toDateString()].timeSec / 60) : 0);
      }
      chartInstance = new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ data: dataPoints, backgroundColor: 'rgba(99, 102, 241, 0.8)', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } } });
    }

    async function selectSubject(subject) {
      currentSubject = subject;
      try {
        const btnText = document.getElementById('setup-title');
        if(btnText) btnText.innerText = "ロード中...";
        // リポジトリ内の相対パス（例: data/geology.json）からデータをフェッチ
        const res = await fetch(subject.dataFile);
        if (!res.ok) throw new Error();
        currentQuizSet = await res.json();
      } catch (e) { 
        return alert(`JSONデータの読み込みに失敗しました。\n・リポジトリ内に ${subject.dataFile} が存在するか確認してください。\n・GitHub Pagesに反映されるまで数分かかる場合があります。`); 
      }
      
      document.getElementById('setup-title').innerText = subject.name;
      document.getElementById('setup-count').innerText = currentQuizSet.length;
      document.getElementById('setup-icon').innerHTML = `<i class="fa-solid ${subject.icon}"></i>`;
      showScreen('quiz');
    }

    function startQuizEngine(count) {
      let shuffled = [...currentQuizSet].sort(() => Math.random() - 0.5);
      activeQuestions = count > 0 && count < shuffled.length ? shuffled.slice(0, count) : shuffled;
      currentQuestionIndex = score = 0; wrongAnswersLog = []; sessionStartTime = Date.now();
      showScreen('engine'); renderQuestion();
    }

    function renderQuestion() {
      const q = activeQuestions[currentQuestionIndex], total = activeQuestions.length;
      document.getElementById('engine-q-num').innerText = currentQuestionIndex + 1;
      document.getElementById('engine-progress-text').innerText = `${currentQuestionIndex + 1} / ${total}`;
      document.getElementById('engine-progress-bar').style.width = `${((currentQuestionIndex + 1) / total) * 100}%`;
      document.getElementById('q-category').innerText = q.category || '問題';
      document.getElementById('q-text').innerText = q.question;
      const optsContainer = document.getElementById('q-options'); optsContainer.innerHTML = '';
      document.getElementById('feedback-box').classList.add('hidden');
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-5 rounded-2xl bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 transition flex items-center gap-4";
        btn.innerHTML = `<div class="w-8 h-8 rounded-full border-2 border-slate-600 flex items-center justify-center text-sm font-bold text-slate-400 shrink-0">${['A','B','C','D','E'][idx]}</div><span class="text-slate-200 font-medium">${opt}</span>`;
        btn.onclick = () => checkAnswer(idx); optsContainer.appendChild(btn);
      });
    }

    function checkAnswer(selectedIdx) {
      const q = activeQuestions[currentQuestionIndex], buttons = document.getElementById('q-options').getElementsByTagName('button');
      for (let btn of buttons) { btn.disabled = true; btn.classList.add('opacity-50', 'cursor-not-allowed'); }
      const isCorrect = (selectedIdx === q.answer);
      if (isCorrect) { score++; buttons[selectedIdx].className += ' !bg-emerald-900/40 !border-emerald-500 opacity-100'; }
      else {
        wrongAnswersLog.push({ q: q.question, userAns: q.options[selectedIdx], correctAns: q.options[q.answer], exp: q.explanation });
        buttons[selectedIdx].className += ' !bg-rose-900/40 !border-rose-500 opacity-100';
        buttons[q.answer].className += ' !bg-emerald-900/20 !border-emerald-500/50 opacity-100';
      }
      const fBox = document.getElementById('feedback-box'); fBox.className = `mt-6 p-5 rounded-2xl border space-y-3 fade-in shadow-lg ${isCorrect ? 'bg-emerald-950/40 border-emerald-500/30' : 'bg-rose-950/40 border-rose-500/30'}`;
      document.getElementById('feedback-title').innerHTML = isCorrect ? `<i class="fa-solid fa-check text-emerald-400"></i> <span class="text-emerald-400">正解！</span>` : `<i class="fa-solid fa-xmark text-rose-400"></i> <span class="text-rose-400">不正解...</span>`;
      document.getElementById('feedback-desc').innerText = q.explanation || "解説はありません。";
    }

    function nextQuestion() {
      currentQuestionIndex++;
      currentQuestionIndex < activeQuestions.length ? renderQuestion() : finishQuiz();
    }

    function finishQuiz() {
      const elapsedSec = Math.floor((Date.now() - sessionStartTime) / 1000);
      userStats.totalTimeSec += elapsedSec; userStats.todayTimeSec += elapsedSec;
      userStats.totalQuestions += activeQuestions.length; userStats.totalCorrect += score;
      userStats.dailyLog[new Date().toDateString()].timeSec += elapsedSec;
      saveStats();

      const total = activeQuestions.length, acc = Math.round((score / total) * 100);
      document.getElementById('result-acc').innerText = `${acc}%`;
      document.getElementById('result-score-detail').innerText = `${score} / ${total} 問正解`;
      document.getElementById('result-time').innerText = `${Math.floor(elapsedSec / 60)}:${String(elapsedSec % 60).padStart(2, '0')}`;

      const reviewSec = document.getElementById('review-section'), reviewList = document.getElementById('review-list');
      reviewList.innerHTML = '';
      if (wrongAnswersLog.length > 0) {
        reviewSec.classList.remove('hidden');
        wrongAnswersLog.forEach(w => {
          reviewList.innerHTML += `<div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 text-left"><div class="font-bold text-slate-200 mb-3"><span class="text-rose-400 mr-2">Q.</span>${w.q}</div><div class="grid grid-cols-2 gap-3 mb-3 text-sm"><div class="bg-rose-950/30 border border-rose-500/20 p-3 rounded-xl text-rose-200"><div class="text-[10px] text-rose-400/70 mb-1">あなたの回答</div>${w.userAns}</div><div class="bg-emerald-950/30 border border-emerald-500/20 p-3 rounded-xl text-emerald-200"><div class="text-[10px] text-emerald-400/70 mb-1">正解</div>${w.correctAns}</div></div><div class="text-xs text-slate-400 bg-slate-900/50 p-3 rounded-xl">解説： ${w.exp}</div></div>`;
        });
      } else { reviewSec.classList.add('hidden'); }
      showScreen('result');
    }

    function retrySubject() { selectSubject(currentSubject); }
    
    function resetStats() {
      if(confirm('勉強時間のデータをリセットしますか？')) {
        userStats = { totalTimeSec: 0, todayTimeSec: 0, lastDate: new Date().toDateString(), totalQuestions: 0, totalCorrect: 0, dailyLog: {} };
        saveStats(); initApp();
      }
    }
  </script>
</body>
</html>
